# Example only. Copy values into ~/.config/autoresearch-gym/targets.toml or
# .autoresearch.local.toml and replace every placeholder with private values.

[targets.windows_gpu]
kind = "ssh"
host = "user@windows-gpu.example.invalid"
remote_root = "C:/code/autoresearch-gym"
path_style = "windows"
python = ".venv/Scripts/python.exe"
artifact_sync = "scp"
# Optional for long remote in-process or external runs.
# live_sync_interval_seconds = 10
# in_process_timeout_padding_seconds = 1800

[targets.local]
kind = "local"
